services:
  # EarnFlow Full-Stack Web Service
  - type: web
    name: earnflow-app
    env: node
    plan: starter
    buildCommand: "npm install && npm run install:all && npm run build"
    startCommand: "npm start"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: earnflow-db
          property: connectionString

databases:
  # Managed PostgreSQL Database
  - name: earnflow-db
    plan: starter
    databaseName: earnflow
    user: earnflow
